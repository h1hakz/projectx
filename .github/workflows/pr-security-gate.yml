name: PR Security Gate (Mobile DevSecOps)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  security-events: write
  issues: write
  checks: write

concurrency:
  group: sec-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. SAST — semgrep (generic) + mobsfscan (iOS/Android-aware)
  # ------------------------------------------------------------------
  sast:
    name: SAST (semgrep + mobsfscan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install semgrep + mobsfscan
        run: |
          pip install --quiet semgrep mobsfscan

      - name: Run semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config configs/.semgrep.yml \
            --sarif --output semgrep.sarif

      - name: Run mobsfscan
        run: |
          mobsfscan . --sarif --output mobsfscan.sarif || true
          mobsfscan . --json   --output mobsfscan.json  || true

      - name: Upload SARIF (semgrep)
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif, category: semgrep }

      - name: Upload SARIF (mobsfscan)
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: mobsfscan.sarif, category: mobsfscan }

      - uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: |
            semgrep.sarif
            mobsfscan.sarif
            mobsfscan.json

  # ------------------------------------------------------------------
  # 2. Secret scanning — gitleaks
  # ------------------------------------------------------------------
  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: configs/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
        continue-on-error: true

      - name: Normalize gitleaks output
        if: always()
        run: |
          [ -f results.sarif ] || echo '{"version": "2.1.0", "runs": []}' > results.sarif

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-results
          path: results.sarif

  # ------------------------------------------------------------------
  # 3. SCA — OWASP Dependency-Check + Trivy filesystem
  # ------------------------------------------------------------------
  sca:
    name: SCA (Dependency-Check + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: "."
          format: "SARIF"
          out: "dc-report"
          args: >
            --enableExperimental
            --suppression configs/dc-suppression.xml
        continue-on-error: true

      - name: Trivy filesystem (vulns + licenses)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-fs.sarif
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: dc-report/dependency-check-report.sarif, category: dependency-check }
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-results
          path: |
            dc-report
            trivy-fs.sarif

  # ------------------------------------------------------------------
  # 4. IaC — Trivy config scan (Dockerfile, k8s, terraform)
  # ------------------------------------------------------------------
  iac:
    name: IaC (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-iac.sarif
          trivy-config: configs/trivy.yaml

      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-iac.sarif, category: trivy-iac }

      - uses: actions/upload-artifact@v4
        with: { name: iac-results, path: trivy-iac.sarif }

  # ------------------------------------------------------------------
  # 5. SBOM — CycloneDX manifest via cdxgen
  # ------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX / cdxgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cdxgen
        run: |
          npm --version
          npm install -g @cyclonedx/cdxgen --omit=optional --ignore-scripts --min-release-age=2
          cdxgen --version || echo "cdxgen install failed"

      - name: Generate SBOM
        run: |
          cdxgen --version
          cdxgen -o sbom.cdx.json .
          ls -la sbom.cdx.json
        env:
          FETCH_LICENSE: true

      - name: Validate SBOM
        run: |
          python --version
          python - <<'PY'
          import json, sys
          d = json.load(open("sbom.cdx.json"))
          assert d.get("bomFormat") == "CycloneDX", "not a CycloneDX document"
          n = len(d.get("components", []))
          print(f"SBOM OK: bomFormat={d.get('bomFormat')} specVersion={d.get('specVersion')} components={n}")
          if n == 0:
              print("::warning::SBOM generated but contains 0 components")
          PY

      - name: Check license compliance
        run: |
          python --version
          python scripts/check-sbom-licenses.py > sbom-license-results.json || true
          echo "=== sbom-license-results.json ==="
          cat sbom-license-results.json || echo "(file missing)"
          echo "=== end ==="

      - name: Upload SBOM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-results
          path: |
            sbom.cdx.json
            sbom-license-results.json

  # ------------------------------------------------------------------
  # 6. DAST — MobSF binary analysis via REST API
  #    Only runs when a mobile BINARY (.apk / .ipa) is present in the PR.
  #    Source-only PRs skip the slow (~6 min) MobSF container entirely and
  #    rely on mobsfscan (SAST) + semgrep for source coverage.
  #
  #    GitHub Actions' `services:` block init fails before MobSF finishes its
  #    Django migrations + Gunicorn startup (~90s). We `docker run -d` manually
  #    and wait from the host, which works in practice for slow-booting images.
  #    A workshop-fixed MOBSF_API_KEY is used by both the container and the curl
  #    steps; override via repo secret for real engagements.
  # ------------------------------------------------------------------
  dast:
    name: DAST (MobSF)
    runs-on: ubuntu-latest
    env:
      MOBSF_API_KEY: ${{ secrets.MOBSF_API_KEY || 'workshop-mobsf-key-please-rotate-99c4f7e2a1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect mobile binary (ipa/apk)
        id: pkg
        run: |
          shopt -s nullglob globstar
          ipa=( **/*.ipa ); apk=( **/*.apk )
          if (( ${#ipa[@]} )); then
            echo "file=${ipa[0]}" >> $GITHUB_OUTPUT
            echo "has_binary=true" >> $GITHUB_OUTPUT
            echo "Found iOS binary: ${ipa[0]}"
          elif (( ${#apk[@]} )); then
            echo "file=${apk[0]}" >> $GITHUB_OUTPUT
            echo "has_binary=true" >> $GITHUB_OUTPUT
            echo "Found Android binary: ${apk[0]}"
          else
            echo "has_binary=false" >> $GITHUB_OUTPUT
            echo "No .apk/.ipa found — skipping MobSF DAST (source-only PR)."
            echo "::notice title=DAST skipped::No mobile binary (.apk/.ipa) in this PR; MobSF DAST skipped. Source is covered by mobsfscan (SAST) + semgrep."
          fi

      - name: Start MobSF container
        if: steps.pkg.outputs.has_binary == 'true'
        run: |
          docker run -d --name mobsf -p 8000:8000 \
            -e MOBSF_API_KEY="${MOBSF_API_KEY}" \
            opensecurity/mobile-security-framework-mobsf:latest

      - name: Wait for MobSF to be ready (up to 6 min)
        if: steps.pkg.outputs.has_binary == 'true'
        run: |
          for i in {1..72}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000 || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "MobSF ready after $((i*5))s (HTTP $code)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::MobSF did not become ready in 6 minutes — dumping container logs:"
          docker logs mobsf 2>&1 | tail -80
          exit 1
        continue-on-error: true

      - name: MobSF upload + scan + report
        if: steps.pkg.outputs.has_binary == 'true'
        env:
          MOBSF: http://localhost:8000
          FILE:  ${{ steps.pkg.outputs.file }}
        run: |
          set -e
          echo "Scanning: $FILE"
          UP=$(curl -sf -F "file=@${FILE}" -H "Authorization: ${MOBSF_API_KEY}" ${MOBSF}/api/v1/upload)
          echo "$UP"
          HASH=$(echo "$UP" | python3 -c "import sys,json;print(json.load(sys.stdin)['hash'])")
          curl -sf -X POST -d "hash=${HASH}" -H "Authorization: ${MOBSF_API_KEY}" ${MOBSF}/api/v1/scan        >/dev/null
          curl -sf -X POST -d "hash=${HASH}" -H "Authorization: ${MOBSF_API_KEY}" ${MOBSF}/api/v1/report_json -o mobsf-report.json
          curl -sf -X POST -d "hash=${HASH}" -H "Authorization: ${MOBSF_API_KEY}" ${MOBSF}/api/v1/report_pdf  -o mobsf-report.pdf || true
        continue-on-error: true


      - name: Stop MobSF container
        if: always()
        run: docker rm -f mobsf || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-results
          path: |
            mobsf-report.json
            mobsf-report.pdf
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 7. RASP integration check — confirm freeRASP wired into the app
  # ------------------------------------------------------------------
  rasp:
    name: RASP integration check (freeRASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Verify freeRASP is integrated
        run: |
          python scripts/rasp-check.py --root . --report rasp-report.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: rasp-results, path: rasp-report.json }

  # ------------------------------------------------------------------
  # 8. Aggregate + sticky PR comment + Critical/High gate
  # ------------------------------------------------------------------
  gate:
    name: Severity Gate + PR Comment
    needs: [sast, secrets, sca, iac, sbom, dast, rasp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install aggregator deps
        run: pip install --quiet requests jinja2

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with: { path: scan-artifacts }

      - name: Aggregate findings and post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          REPO:         ${{ github.repository }}
        run: |
          python scripts/aggregate-and-comment.py \
            --artifacts scan-artifacts \
            --summary   summary.json

      - name: Enforce Critical/High gate
        run: python scripts/severity-gate.py --summary summary.json --fail-on critical,high

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: final-summary, path: summary.json }
