name: Post-Merge & Nightly Security Scan

# Runs after PRs land on main (defense-in-depth) and nightly at 02:00 UTC.
# Unlike the PR gate, this workflow does NOT block anything — code is already
# merged. Instead it:
#   - uploads SARIF to GitHub Code Scanning (Security tab)
#   - generates an SBOM and uploads it as an artifact
#   - opens/updates ONE tracking issue listing new Critical/High findings
#   - posts a summary to the run's GITHUB_STEP_SUMMARY

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"        # 02:00 UTC every day — catches new CVEs in pinned deps
  workflow_dispatch:

permissions:
  contents: read
  security-events: write       # SARIF upload to Code Scanning
  issues: write                # tracking issue upsert
  actions: read

concurrency:
  group: post-merge-scan
  cancel-in-progress: false    # let nightly + push-to-main both run

jobs:
  scan:
    name: Full scan (SAST + Secrets + SCA + IaC + SBOM + RASP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # -------------------------------------------------------------------
      # Caches — first run downloads ~2GB NVD; cache it.
      # -------------------------------------------------------------------
      - name: Cache OWASP Dependency-Check NVD data
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dc-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dc-nvd-${{ runner.os }}-

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Install scanners
        run: |
          pip install --quiet semgrep mobsfscan requests

      # -------------------------------------------------------------------
      # SAST
      # -------------------------------------------------------------------
      - name: Semgrep
        run: |
          semgrep scan \
            --config p/security-audit --config p/owasp-top-ten --config p/mobsf \
            --config configs/.semgrep.yml \
            --sarif --output semgrep.sarif || true

      - name: mobsfscan
        run: mobsfscan . --sarif --output mobsfscan.sarif --json --output mobsfscan.json || true

      # -------------------------------------------------------------------
      # Secret scanning
      # -------------------------------------------------------------------
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG:     configs/.gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
        continue-on-error: true

      - name: Trufflehog (full repo, verified-only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --json --no-update
        continue-on-error: true

      # -------------------------------------------------------------------
      # SCA + IaC (Trivy fs + config)
      # -------------------------------------------------------------------
      - name: Trivy filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-fs.sarif
        continue-on-error: true

      - name: Trivy IaC config
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-iac.sarif
          trivy-config: configs/trivy.yaml

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: "."
          format: "SARIF"
          out: "dc-report"
          args: --enableExperimental --suppression configs/dc-suppression.xml
        continue-on-error: true

      # -------------------------------------------------------------------
      # SBOM (CycloneDX) — Syft sees iOS + Android dep graphs
      # -------------------------------------------------------------------
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false   # we upload our own bundle below

      # -------------------------------------------------------------------
      # RASP integration check
      # -------------------------------------------------------------------
      - name: freeRASP integration check
        run: python scripts/rasp-check.py --root . --report rasp-report.json

      # -------------------------------------------------------------------
      # Upload SARIFs to Code Scanning (Security tab)
      # -------------------------------------------------------------------
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif,   category: semgrep }
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: mobsfscan.sarif, category: mobsfscan }
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-fs.sarif,  category: trivy-fs }
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-iac.sarif, category: trivy-iac }
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: dc-report/dependency-check-report.sarif, category: dependency-check }
        continue-on-error: true

      # -------------------------------------------------------------------
      # Aggregate + upsert a tracking GitHub Issue (not a PR comment)
      # -------------------------------------------------------------------
      - name: Stage artifacts for aggregator
        run: |
          mkdir -p scan-artifacts/{sast-results,secret-results,sca-results,iac-results,rasp-results}
          cp -f semgrep.sarif mobsfscan.sarif mobsfscan.json scan-artifacts/sast-results/ 2>/dev/null || true
          cp -f results.sarif scan-artifacts/secret-results/ 2>/dev/null || true
          cp -f trivy-fs.sarif scan-artifacts/sca-results/ 2>/dev/null || true
          mkdir -p scan-artifacts/sca-results/dc-report
          cp -rf dc-report/* scan-artifacts/sca-results/dc-report/ 2>/dev/null || true
          cp -f trivy-iac.sarif scan-artifacts/iac-results/ 2>/dev/null || true
          cp -f rasp-report.json scan-artifacts/rasp-results/ 2>/dev/null || true

      - name: Aggregate findings into summary.json
        env: { GITHUB_TOKEN: "" }   # don't try to upsert a PR comment here
        run: python scripts/aggregate-and-comment.py --artifacts scan-artifacts --summary summary.json

      - name: Upsert tracking issue for Critical/High
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:         ${{ github.repository }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/post-merge-issue.py --summary summary.json

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Post-merge scan summary"
            echo ""
            echo '```json'
            cat summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------
      # Artifacts (SBOM + raw reports retained for 90 days)
      # -------------------------------------------------------------------
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-merge-bundle
          retention-days: 90
          path: |
            semgrep.sarif
            mobsfscan.sarif
            trivy-fs.sarif
            trivy-iac.sarif
            dc-report/
            sbom.cdx.json
            rasp-report.json
            summary.json
